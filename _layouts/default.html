<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <script>
    (function () {
      var d = document.documentElement, t = null;
      d.classList.add('js');
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
      d.setAttribute('data-theme', t || 'dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo title=false %}
</head>
<body>
  <a class="skip" href="#main">skip to content</a>
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
  <div class="grid-bg" aria-hidden="true"></div>

  <header class="nav">
    <a class="nav-mark" href="{{ '/' | relative_url }}"><span class="prompt">~/</span>naved</a>
    <nav class="nav-links" aria-label="Sections">
      <a href="#work" data-section="work">work</a>
      <a href="#stack" data-section="stack">stack</a>
      <a href="#notes" data-section="notes">notes</a>
      <a href="#contact" data-section="contact">contact</a>
    </nav>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch colour theme">
      <span class="theme-dot" aria-hidden="true"></span>
    </button>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="foot">
    <span>&copy; {{ site.time | date: "%Y" }} M. N. R. Khan</span>
    <span class="status"><span class="pulse" aria-hidden="true"></span>open to opportunities</span>
    <button class="term-hint" type="button" data-open-term>press <kbd>~</kbd> for a shell</button>
  </footer>

  <div class="term" id="term" role="dialog" aria-modal="true" aria-label="Terminal" hidden>
    <div class="term-win">
      <div class="term-bar">
        <span class="term-title">naved@portfolio: ~</span>
        <button class="term-close" type="button" data-close-term aria-label="Close terminal">esc</button>
      </div>
      <div class="term-out" id="term-out" aria-live="polite"></div>
      <form class="term-line" id="term-form" autocomplete="off">
        <label for="term-in"><span class="prompt">naved@portfolio:~$</span></label>
        <input id="term-in" type="text" spellcheck="false" autocapitalize="off">
      </form>
    </div>
  </div>

  <script id="site-data" type="application/json">
    {
      "email": {{ site.email | jsonify }},
      "github": {{ site.github_username | prepend: "https://github.com/" | jsonify }},
      "linkedin": {{ site.linkedin_url | jsonify }},
      "blog": {{ site.blog_url | jsonify }},
      "orcid": {{ site.orcid_url | jsonify }},
      "projects": [{% for p in site.data.projects %}{"id": {{ p.id | jsonify }}, "title": {{ p.title | jsonify }}, "tagline": {{ p.tagline | jsonify }}, "repo": {{ p.repo | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
    }
  </script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
