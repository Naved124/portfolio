---
layout: default
---
<article class="project-page">
  <h1>{{ page.title }}</h1>
  <p class="project-stack"><strong>Stack:</strong> {{ page.stack }}</p>
  {% if page.repo %}
    <p><a href="{{ page.repo }}" target="_blank" rel="noopener">View repository →</a></p>
  {% endif %}
  <div class="project-body">
    {{ content }}
  </div>
  <p><a href="{{ '/' | relative_url }}">← Back to home</a></p>
</article>
